[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitbucket-server-mcp"
version = "0.1.0"
description = "FastMCP server for Bitbucket Server / Bitbucket Data Center (self-hosted)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.4.10",
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.16.3,<3.0",
    "tenacity>=9.0.0,<10.0",
    "structlog>=26.1.0,<27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "respx>=0.23.1",
    "ruff>=0.9.0",
    "mypy>=2.4.1",
]

[project.scripts]
bitbucket-mcp = "bitbucket_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitbucket_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bitbucket_mcp"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tenacity.*", "structlog.*"]
ignore_missing_imports = true
